# Training configuration for NoiseAwareDnCNN

training:
  epochs: 50
  batch_size: 16
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5

  optimizer: "adam"
  scheduler: "cosine"
  use_amp: false

loss:
  l1_weight: 0.8
  mse_weight: 0.2
  use_charbonnier: false
  use_gradient_loss: false
  use_frequency_loss: false
  use_perceptual_loss: false

augmentation:
  use_random_crop: true
  use_random_flip: true
  use_hard_sample_mining: false

model:
  channels: 64
  blocks: 10
  use_attention: false
  use_degradation_encoder: true # Key: noise sigma conditioning
  use_high_frequency_branch: false
  use_edge_branch: false
  use_global_residual: true

# Noise model parameters (empirically fitted)
noise_model:
  var_a: 0.01846589
  var_b: 0.00843552
  var_c: -0.00033869
